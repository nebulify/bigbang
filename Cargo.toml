[package]
name = "bigbang"
version = "0.1.0"
edition = "2021"
description = "Colistor deployment CLI — recipes, vault, library and profiles over RepoDB"
license = "Proprietary"

[[bin]]
name = "bigbang"
path = "src/main.rs"

[lib]
name = "bigbang"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# default-features off: the defaults pull reqwest and tower-http in to resolve remote $ref, which
# this tool never does — every schema it validates against ships in the binary.
jsonschema = { version = "0.26", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
# Assertion patterns: MATCHES / NOT_MATCHES are regular expressions.
regex = "1"
# Vault crypto, matching javax.crypto exactly: PBKDF2WithHmacSHA256 -> AES/GCM/NoPadding.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Line editing and history for shell mode.
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
# The cached vault password is wiped on drop rather than left in freed memory.
zeroize = { version = "1", features = ["zeroize_derive"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "alloc", "getrandom"] }
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"

[profile.release]
lto = true
strip = true
